schema_version: 1

id: W5
slug: repair
name: Execution-Guided Repair
description: >-
  Generate and execute one SPARQL query. If execution fails or returns an empty
  SELECT result, repair the query once and execute the repaired query once.

steps:
  - id: generate
    capability: sparql_generation
    inputs:
      - question
    produces:
      - generated_query

  - id: execute_initial
    capability: sparql_execution
    inputs:
      - generated_query
    produces:
      - initial_execution

  - id: repair
    capability: sparql_repair
    when:
      execution_status_in:
        - execution_error
        - empty_result
    inputs:
      - question
      - generated_query
      - initial_execution
    produces:
      - repaired_query

  - id: execute_repaired
    capability: sparql_execution
    when:
      output_exists: repaired_query
    inputs:
      - repaired_query
    produces:
      - repaired_execution

limits:
  max_initial_generations: 1
  max_repairs: 1
  max_sparql_executions: 2

output:
  final_query:
    prefer: repaired_query
    fallback: generated_query
  final_execution:
    prefer: repaired_execution
    fallback: initial_execution