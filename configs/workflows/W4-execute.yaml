schema_version: 1

id: W4
slug: execute
name: Generation with Execution
description: >-
  Generate one SPARQL query directly from the natural-language question and
  execute it once against the configured endpoint, without grounding, schema
  retrieval, or repair.

steps:
  - id: generate
    capability: sparql_generation
    inputs:
      - question
    produces:
      - generated_query

  - id: execute
    capability: sparql_execution
    inputs:
      - generated_query
    produces:
      - execution_result

limits:
  max_initial_generations: 1
  max_repairs: 0
  max_sparql_executions: 1

output:
  final_query:
    select: generated_query
  final_execution:
    select: execution_result
